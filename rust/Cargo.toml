[package]
name = "canon-datastar"
version = "0.1.0"
edition = "2024"
description = "Astryx design system components as server-rendered HTML (maud) for Datastar apps."
license = "MIT"
repository = "https://github.com/sensibile/canon-datastar"

[dependencies]
maud = "0.27"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = { version = "0.27", features = ["axum"] }

[[example]]
name = "demo"
